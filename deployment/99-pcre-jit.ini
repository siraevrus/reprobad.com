; Отключает PCRE JIT — убирает шум в логах:
;   preg_match(): Allocation of JIT memory failed, PCRE JIT will be disabled
;
; Установка (Ubuntu/Debian PHP 8.4):
;   sudo cp deployment/99-pcre-jit.ini /etc/php/8.4/cli/conf.d/99-pcre-jit.ini
;   sudo cp deployment/99-pcre-jit.ini /etc/php/8.4/fpm/conf.d/99-pcre-jit.ini
;   sudo systemctl reload php8.4-fpm
;
; CLI нужен обязательно: cron (artisan schedule:run, sitemap:generate) идёт через php-cli.
; FPM на проде уже может иметь pcre.jit=0 в php.ini — дублировать безопасно.

pcre.jit=0
